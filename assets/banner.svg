      <stop offset="1" stop-color="#0C0A08"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 12) rotate(24) scale(600 300)">
      <stop offset="0" stop-color="#00ADD8" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#00ADD8" stop-opacity="0.09"/>
