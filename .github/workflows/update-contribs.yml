name: Update OSS Contributions

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 6 AM UTC
  workflow_dispatch:        # manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate OSS contribution table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, re, os

          token = os.environ.get("GH_TOKEN", "")
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "readme-update-bot"
          }

          def gh_get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # Search for all merged PRs authored by kaiizer777 in public repos
          url = (
              "https://api.github.com/search/issues"
              "?q=author:kaiizer777+type:pr+is:merged+is:public"
              "&per_page=100&sort=created&order=desc"
          )
          data = gh_get(url)
          items = data.get("items", [])

          # Skip PRs in the profile repo itself
          items = [i for i in items if "kaiizer777/kaiizer777" not in i.get("repository_url", "")]

          # Group by repo slug
          repos: dict[str, list] = {}
          for item in items:
              # repository_url: https://api.github.com/repos/owner/repo
              parts = item["repository_url"].split("/")
              repo = f"{parts[-2]}/{parts[-1]}"
              repos.setdefault(repo, []).append(item)

          if not repos:
              print("No merged PRs found, skipping update.")
              exit(0)

          # Build markdown sections
          sections = []
          for repo, prs in repos.items():
              rows = "\n".join(
                  f"| [#{pr['number']}]({pr['html_url']}) | {pr['title']} |"
                  for pr in prs
              )
              count = len(prs)
              section = (
                  f"**{repo}** — {count} merged PR{'s' if count > 1 else ''}\n\n"
                  f"| PR | Title |\n| :-- | :-- |\n{rows}"
              )
              sections.append(section)

          table = "\n\n".join(sections)
          replacement = f"<!-- OSS_CONTRIBS_START -->\n{table}\n<!-- OSS_CONTRIBS_END -->"

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          new_content = re.sub(
              r"<!-- OSS_CONTRIBS_START -->.*?<!-- OSS_CONTRIBS_END -->",
              replacement,
              content,
              flags=re.DOTALL,
          )

          if new_content == content:
              print("No changes detected.")
          else:
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(new_content)
              total = sum(len(v) for v in repos.values())
              print(f"Updated README: {total} PRs across {len(repos)} repo(s)")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet \
            && echo "Nothing to commit." \
            || (git commit -m "chore: auto-update OSS contributions [skip ci]" && git push)
